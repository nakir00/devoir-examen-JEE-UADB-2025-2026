spring.application.name=gestion-produits

# PostgreSQL : les variables d'environnement permettent de changer la
# configuration sans modifier le code source.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_produits}
spring.datasource.username=${DB_USERNAME:gestion_user}
spring.datasource.password=${DB_PASSWORD:gestion_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Les tables sont créées/mises à jour à partir des entités JPA (usage local).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Refuser les quantités décimales plutôt que de les tronquer en entiers.
spring.jackson.deserialization.accept-float-as-int=false
